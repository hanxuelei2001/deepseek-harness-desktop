name: Setup Node.js and pnpm
description: Install the repository pnpm version and configure Node.js caching

inputs:
  node-version:
    description: Node.js version passed to actions/setup-node
    required: false
    default: '24'
  cache-dependency-path:
    description: Dependency lockfile used for the pnpm cache key
    required: false
    default: pnpm-lock.yaml

runs:
  using: composite
  steps:
    # package.json 的 packageManager 字段提供精确 pnpm 版本。
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    # 确保 pnpm 缓存目录和 node_modules 存在，避免保存缓存时路径验证失败
    - name: Ensure cache directories exist
      shell: bash
      run: |
        # 创建常见的 pnpm store 路径（actions/setup-node 默认可能使用的路径）
        mkdir -p ~/.local/share/pnpm
        mkdir -p ~/.pnpm-store
        # 创建项目 node_modules 目录（如果不存在），避免缓存路径验证失败
        mkdir -p node_modules
        # 动态获取实际 pnpm store 路径并创建（防止配置变更）
        STORE_PATH="$(pnpm store path 2>/dev/null || echo ~/.local/share/pnpm/store/v3)"
        mkdir -p "$STORE_PATH"

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: ${{ inputs.cache-dependency-path }}
